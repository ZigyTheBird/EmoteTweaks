plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "de.maxhenkel.voicechat:voicechat-api:${rootProject.voicechat_api}"
    modImplementation "maven.modrinth:simple-voice-chat:neoforge-${rootProject.voicechat}"

    modImplementation "maven.modrinth:emotecraft:${rootProject.emotecraft}+${rootProject.minecraft_version}-forge"

    implementation "com.zigythebird.multiloaderutils:zigysmultiloaderutils-neoforge-1.21:$rootProject.multiloader_utils_version"
    include "com.zigythebird.multiloaderutils:zigysmultiloaderutils-neoforge-1.21:$rootProject.multiloader_utils_version"

    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${project.player_animation_lib}"
}

processResources {
    var replacedProperties = [
            version: project.version,
            voicechat: rootProject.voicechat,
            emotecraft: rootProject.emotecraft
    ]
    inputs.properties replacedProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
        expand voicechat: rootProject.voicechat
        expand emotecraft: rootProject.emotecraft
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
